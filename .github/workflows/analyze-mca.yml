name: Analyze Minecraft Region

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install nbtlib

      - name: Analyze region
        run: |
          python scripts/analyze_mca.py \
            --input r.0.-1.mca \
            --output report

      - name: Generate schematic
        run: |
          python scripts/generate_schem.py \
            --input r.0.-1.mca \
            --output report/pale-construct.schem

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mca-analysis
          path: report/
